name: Validate marketplace

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate marketplace structure
        run: python3 scripts/validate_marketplace.py .
      - name: Compile Python scripts
        run: python3 -m compileall -q scripts
